<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>


<!-- Navbar -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            ShopEase

        </a>

        <a href="index.html"
           class="btn btn-outline-light">

            Continue Shopping

        </a>

    </div>

</nav>


<!-- Cart -->

<div class="container py-5">

    <h2 class="fw-bold mb-4">
        Shopping Cart
    </h2>


    <!-- Product 1 -->

    <div class="card shadow-sm border-0 mb-3">

        <div class="card-body">

            <div class="row align-items-center">


                <div class="col-md-2">

                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=300&q=80"
                         class="cart-image rounded"
                         alt="Headphones">

                </div>


                <div class="col-md-3">

                    <h5>
                        Headphones
                    </h5>

                    <p class="text-muted">
                        $129 each
                    </p>

                </div>


                <div class="col-md-3">

                    <label class="form-label">
                        Quantity
                    </label>

                    <input type="number"
                           value="1"
                           min="1"
                           class="form-control quantity-input">

                </div>


                <div class="col-md-2">

                    <h5>
                        $129
                    </h5>

                </div>


                <div class="col-md-2">

                    <button class="btn btn-danger w-100">
                        Remove
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Product 2 -->

    <div class="card shadow-sm border-0 mb-3">

        <div class="card-body">

            <div class="row align-items-center">


                <div class="col-md-2">

                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=300&q=80"
                         class="cart-image rounded"
                         alt="Smart Watch">

                </div>


                <div class="col-md-3">

                    <h5>
                        Smart Watch
                    </h5>

                    <p class="text-muted">
                        $159 each
                    </p>

                </div>


                <div class="col-md-3">

                    <label class="form-label">
                        Quantity
                    </label>

                    <input type="number"
                           value="2"
                           min="1"
                           class="form-control quantity-input">

                </div>


                <div class="col-md-2">

                    <h5>
                        $318
                    </h5>

                </div>


                <div class="col-md-2">

                    <button class="btn btn-danger w-100">
                        Remove
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Cart Summary -->

    <div class="card shadow-sm border-0 mt-4">

        <div class="card-body">

            <div class="row">


                <div class="col-md-8">

                    <p>
                        Subtotal:
                        <strong>$447</strong>
                    </p>

                    <p>
                        Shipping:
                        <strong>$10</strong>
                    </p>

                    <h4>
                        Total: $457
                    </h4>

                </div>


                <div class="col-md-4 text-md-end">

                    <a href="checkout.html"
                       class="btn btn-success btn-lg">

                        Proceed to Checkout

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
