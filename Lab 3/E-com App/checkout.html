<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Checkout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>


<!-- Navbar -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            ShopEase

        </a>

        <a href="cart.html"
           class="btn btn-outline-light">

            Back to Cart

        </a>

    </div>

</nav>


<!-- Checkout -->

<div class="container py-5">

    <div class="row g-4">


        <!-- Customer Information -->

        <div class="col-lg-7">

            <div class="card shadow-sm border-0 p-4">

                <h2 class="fw-bold mb-4">
                    Checkout
                </h2>


                <form>


                    <div class="row g-3">


                        <div class="col-md-6">

                            <label class="form-label">
                                First Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Last Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="col-12">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="col-12">

                            <label class="form-label">
                                Address
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="House number, street and area"
                                   required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                City
                            </label>

                            <input type="text"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Postal Code
                            </label>

                            <input type="text"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="col-12">

                            <label class="form-label">
                                Payment Method
                            </label>

                            <select class="form-select">

                                <option>
                                    Cash on Delivery
                                </option>

                                <option>
                                    Credit Card
                                </option>

                                <option>
                                    Debit Card
                                </option>

                            </select>

                        </div>


                        <div class="col-12">

                            <label class="form-label">
                                Card Number
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Enter card number">

                        </div>


                        <div class="col-12">

                            <button type="submit"
                                    class="btn btn-success btn-lg w-100">

                                Place Order

                            </button>

                        </div>


                    </div>

                </form>

            </div>

        </div>


        <!-- Order Summary -->

        <div class="col-lg-5">

            <div class="card shadow-sm border-0 p-4">

                <h4 class="fw-bold mb-4">
                    Order Summary
                </h4>


                <div class="d-flex justify-content-between
                            border-bottom py-3">

                    <span>
                        Headphones x 1
                    </span>

                    <strong>
                        $129
                    </strong>

                </div>


                <div class="d-flex justify-content-between
                            border-bottom py-3">

                    <span>
                        Smart Watch x 2
                    </span>

                    <strong>
                        $318
                    </strong>

                </div>


                <div class="d-flex justify-content-between pt-3">

                    <span>
                        Subtotal
                    </span>

                    <strong>
                        $447
                    </strong>

                </div>


                <div class="d-flex justify-content-between py-2">

                    <span>
                        Shipping
                    </span>

                    <strong>
                        $10
                    </strong>

                </div>


                <div class="d-flex justify-content-between
                            border-top pt-3 mt-2">

                    <h5>
                        Total
                    </h5>

                    <h5>
                        $457
                    </h5>

                </div>

            </div>

        </div>


    </div>

</div>

</body>
</html>
